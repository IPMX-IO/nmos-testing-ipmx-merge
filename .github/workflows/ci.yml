name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the dev image
        run: docker build -t dev-image .
      - name: Lint and test
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE":/work -w /work \
            -e HOME=/tmp -e CI=1 \
            dev-image make precommit
